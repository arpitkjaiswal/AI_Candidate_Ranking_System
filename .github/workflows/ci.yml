name: Application checks
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=moderate
      - run: npm run build --prefix frontend
        env:
          VITE_API_BASE_URL: ''
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests against production server
        run: |
          DEMO_MODE=true python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/redrob-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          curl --retry 10 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          npm run test:e2e --prefix frontend
      - name: Server diagnostics
        if: failure()
        run: cat /tmp/redrob-server.log 2>/dev/null || true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker build -t redrob-ranking:release .
      - run: python3 scripts/verify_container.py
