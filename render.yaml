services:
  - type: web
    name: redrob-ranking-api
    runtime: python
    buildCommand: pip install -r requirements.txt -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://redrob-project-ngxl.vercel.app
